<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>orbit-drop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; background: #05070c; color: #e5e7eb; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  h1 small { color: #6b7280; font-weight: 400; font-size: 13px; }
  #wrap { width: 100%; max-width: 820px; }
  canvas { width: 100%; aspect-ratio: 800 / 520; border: 1px solid #1f2937; border-radius: 12px; touch-action: none; background: #0b0f17; }
  #hud { color: #9ca3af; font-size: 13px; margin: 8px 2px 0; }
  #bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button { background: #1f2937; border: 1px solid #374151; color: #e5e7eb; padding: 8px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
  button:hover { background: #374151; }
  #msg { margin-left: auto; font-size: 13px; }
  #msg.ok { color: #22c55e; } #msg.err { color: #ef4444; }
  footer { color: #4b5563; font-size: 12px; }
</style>
</head>
<body>
  <h1>🪐 orbit-drop <small>— use a gravidade para acertar o anel verde</small></h1>
  <div id="wrap">
    <canvas id="game" width="800" height="520"></canvas>
    <div id="hud"></div>
    <div id="bar">
      <button id="retry">Repetir</button>
      <button id="next">Próxima fase →</button>
      <span id="msg"></span>
    </div>
  </div>
  <footer>estilingue: arraste do ponto branco e solte · física newtoniana</footer>
  <script type="module" src="./game.js"></script>
</body>
</html>
